name: Build and package UUID_TIME plugin

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: lefred/mariadb-plugin-ci/.github/workflows/build-plugin.yml@v1
    with:
      plugin_name: uuid-time
      plugin_directory: uuid_time
      build_target: uuid_time
      plugin_library: uuid_time.so
      cmake_options: -DPLUGIN_DATE_EXTRA=DYNAMIC
      test_suite: uuid_time
      run_tests: ${{ startsWith(github.ref, 'refs/tags/v') }}
